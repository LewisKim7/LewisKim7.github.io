name: Site (portfolio + blog)

# lewiskim7.github.io 빌드·배포. 블로그 누적 데이터는 blog-data 브랜치에만 커밋한다
# (main 이력과 지원 앱 Vercel 배포를 건드리지 않기 위함).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      urls: ${{ steps.idx.outputs.urls }}
      key: ${{ steps.idx.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - name: Load blog data
        run: |
          git fetch --depth=1 origin blog-data && git show origin/blog-data:posts.json > posts.json || echo '{}' > posts.json
      - name: Build
        env:
          INDEXNOW_ALL: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python3 site/build.py posts.json
      - id: idx
        run: |
          echo "urls=$(cat indexnow_urls.json)" >> "$GITHUB_OUTPUT"
          echo "key=$(python3 -c "import json;print(json.load(open('site/config.json'))['indexnow_key'])")" >> "$GITHUB_OUTPUT"
      - name: Save blog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir /tmp/bd && cp posts.json /tmp/bd/
          cd /tmp/bd && git init -q -b blog-data && git add posts.json
          if git -C "$GITHUB_WORKSPACE" show origin/blog-data:posts.json 2>/dev/null | cmp -s - posts.json; then
            echo "no new posts"; exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "blog data $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" blog-data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify search engines (IndexNow → Bing, Naver 등)
        if: needs.build.outputs.urls != '[]'
        env:
          URLS: ${{ needs.build.outputs.urls }}
          KEY: ${{ needs.build.outputs.key }}
        run: |
          python3 - "$KEY" <<'PY' > body.json
          import json, os, sys
          print(json.dumps({"host": "lewiskim7.github.io", "key": sys.argv[1],
                            "keyLocation": f"https://lewiskim7.github.io/{sys.argv[1]}.txt",
                            "urlList": json.loads(os.environ["URLS"])}))
          PY
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @body.json
